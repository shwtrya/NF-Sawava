services:
  nf-sawava:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nf-sawava
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../data/netflix_proxies.txt:/app/data/netflix_proxies.txt
      - ../data/netflix_suite.db:/app/data/netflix_suite.db
